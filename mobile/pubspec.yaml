name: ntemo_one_mobile
description: "Application mobile officielle NTEMO ONE - Pointage QR, Badge Virtuel, Congés et Profil"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^9.0.0
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_hd.png


# Icône de l'application (dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/app_icon_foreground.png
  min_sdk_android: 24

# Écran de lancement (dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash_logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/app_icon_foreground.png
